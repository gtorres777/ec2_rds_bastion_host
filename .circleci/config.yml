version: 2.1

executors:
  ubuntu-executor:
    docker:
      - image: cimg/base:current-20.04

orbs:
  terraform: circleci/terraform@3.0.0
  slack: circleci/slack@4.3.0

commands:
  set_pull_request_branch:
    steps:
      - run:
          name: Getting target branch
          command: |
            # Default branch to avoid issues.
            target_branch="master"
            echo "export LG_PR_TARGET=$target_branch" >> "$BASH_ENV"
  notify_slack_error:
    steps:
      - slack/notify:
          branch_pattern: "master|staging|production"
          event: fail
          channel: $SLACK_CHANNEL
          template: basic_fail_1

  notify_slack_pass:
    steps:
      - run:
          name: Print Commit Message
          command: |
            echo 'export COMMIT_MESSAGE=$(git log --format=%B -n 1 $CIRCLE_SHA1)' >> $BASH_ENV
            echo 'export BLOCK_KIT=$(cat .circleci/templates/basic_success.json)' >> $BASH_ENV
            source $BASH_ENV


      - run:
          name: Print2 Commit Message
          command: cat .circleci/templates/basic_success.json

      - run:
          name: Print2 Commit Message
          command: |
            echo $COMMIT_MESSAGE

      - run:
          name: Print3 BLOCK Message
          command: |
            echo $BLOCK_KIT

      - slack/notify:
          branch_pattern: "master|staging|production"
          event: pass
          channel: $SLACK_CHANNEL
          custom: |
              $BLOCK_KIT
          # custom: !!str |-
          #   $(cat .circleci/templates/basic_succes.json)


